<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christy Ahn — Portfolio</title>
<meta name="description" content="Portfolio of consulting, data & analytics, and behavioral research work.">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Page background and text colors come from your style.css. Only the folders have their own colors. */

  .drawer {
    position: relative;
    height: 410px;
    margin-top: 64px;
    /* Clip the bottom only, so lifted folders and paper can rise above the top edge */
    clip-path: inset(-90px -16px 0 -16px);
  }

  .folder {
    --tab-h: 58px;
    --tab-w: 31%;
    position: absolute;
    left: 0; right: 0;
    bottom: -40px;
    display: block;
    color: #fff4f1;
    text-decoration: none;
    isolation: isolate;
    filter: drop-shadow(0 -3px 6px rgba(0, 0, 0, 0.22));
    transition: transform 0.38s cubic-bezier(.3,1.3,.5,1), filter 0.3s ease;
  }
  /* Muted reds, lightest at the back to deepest at the front */
  .f1 { top: 0;     --c: #b8595f; --tab-x: 3%;  z-index: 1; }
  .f2 { top: 120px; --c: #9c3d44; --tab-x: 35%; z-index: 2; }
  .f3 { top: 240px; --c: #7a2a30; --tab-x: 67%; z-index: 3; }

  .folder:hover,
  .folder:focus-visible {
    transform: translateY(-24px);
    filter: drop-shadow(0 -4px 10px rgba(0, 0, 0, 0.3)) brightness(1.08);
  }
  .folder:focus-visible { outline: none; }
  .folder:focus-visible .sheet { outline: 3px solid currentColor; outline-offset: 3px; }

  /* Folder body */
  .sheet {
    position: absolute;
    top: var(--tab-h); left: 0; right: 0; bottom: 0;
    z-index: 1;
    padding: 18px 28px;
    border-radius: 12px 12px 0 0;
    background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.14)), var(--c);
  }

  /* Tab with curved shoulders, like a real folder */
  .tab {
    position: absolute;
    top: 0;
    left: var(--tab-x);
    z-index: 2;
    width: var(--tab-w);
    min-height: calc(var(--tab-h) + 1px); /* 1px overlap hides the seam with the body */
    display: flex;
    align-items: center;
    padding: 0 22px;
    border-radius: 14px 14px 0 0;
    background: var(--c);
    font-weight: 700;
    font-size: clamp(1.1rem, 2.5vw, 1.7rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    white-space: nowrap;
